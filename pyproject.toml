[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-lens"
version = "1.0.0"
description = "Intermittent-demand forecast that treats stockout days as censored, not as zero sales."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TechieGoku2623" }]
dependencies = []

[project.optional-dependencies]
dev = ["black==24.8.0", "flake8==7.1.1"]

[project.scripts]
demand-lens = "demand_lens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
